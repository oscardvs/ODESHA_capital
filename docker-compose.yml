version: '3'

services:
  # Main application service
  quant-ml-trader:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quant-ml-trader
    ports:
      - "8501:8501"  # Streamlit port
    volumes:
      - ./quant_ml_trader:/app/quant_ml_trader
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_HEADLESS=true
    restart: unless-stopped
    networks:
      - quant-network

  # Database service (optional)
  database:
    image: postgres:13
    container_name: quant-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=quant
      - POSTGRES_PASSWORD=quantpass
      - POSTGRES_DB=quantdb
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - quant-network

networks:
  quant-network:
    driver: bridge

volumes:
  postgres-data:
